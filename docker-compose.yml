name: ai-db-upgrade-agent

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: db-upgrade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db_upgrade_agent}
      POSTGRES_USER: ${POSTGRES_USER:-upgrade_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_local_env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-upgrade_admin} -d $${POSTGRES_DB:-db_upgrade_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - upgrade-agent-net

  backend:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: ../infra/docker/backend.Dockerfile
    container_name: db-upgrade-backend
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-db_upgrade_agent}
      POSTGRES_USER: ${POSTGRES_USER:-upgrade_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_local_env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-upgrade_admin}:${POSTGRES_PASSWORD:-change_me_in_local_env}@postgres:5432/${POSTGRES_DB:-db_upgrade_agent}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - upgrade-agent-net

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: ../infra/docker/frontend.Dockerfile
    container_name: db-upgrade-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - upgrade-agent-net

volumes:
  postgres_data:
    driver: local

networks:
  upgrade-agent-net:
    driver: bridge
